# The financial-audit pipeline.
#
# Each entry re-declares its task's contract and adds only wiring. The contract
# must match what pantheon-go generated -- `ptn plan` reports a duplicate-name
# error if these disagree with the generated files, which is why this file wires
# ADAPTER tasks rather than restating generated ones.
#
# The chain: a webhook fires fetch_ledger, whose output feeds normalize_fx.
# Everything downstream of that consumes the normalised ledger.
kind: task
name: finance.audit_entry
version: 1
summary: Entry point for the financial-audit pipeline.
runner:
  kind: script
  runtime: go
  entry: finance.fetch_ledger
input: finance.LedgerQuery@1
output: finance.LedgerExtract@1
uses:
  - name: ledger
    verbs: [query]
policy:
  timeout: "1m0s"
  retry: 2
  idempotent: true
on: finance.audit_request@1
