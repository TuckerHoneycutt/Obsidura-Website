[workspace]
resolver = "2"
members = ["crates/ptn-vocab", "crates/ptn-registry", "crates/ptn-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
schemars = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
