[pytest]
testpaths = tests dev-administration/tests aurora-cli/tests
python_files = test_*.py
# `aurora-cli` so `from aurora_cli import identity` works without installing
# the package; `dev-administration` so `aurora-cli/tests` can import the ONE
# implementation of _strip_docstrings instead of growing a second one.
#
# Deliberately NOT an `aurora-cli/tests/__init__.py`. `dev-administration/tests`
# is already a package literally named `tests`, and a second package with the
# same name is a genuine import collision -- whichever pytest imports first
# wins and the other's modules become unreachable.
pythonpath = aurora-cli dev-administration
