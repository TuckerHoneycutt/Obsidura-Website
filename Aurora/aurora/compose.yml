
# HERMES ON 7444
# Hermes deploy - tailscale serve --bg --https 7444 http://127.0.0.1:9119

include:
  - ./affine/compose.yml
  # Per-developer Hermes agents. GENERATED — see compose.agents.yml's header.
  # Before Chunk 2 these were created by `docker run` in dev_administration
  # and carried no compose label at all, so `docker compose down` could not
  # see them and a branch stack had none.
  - ./compose.agents.yml

# --- STORAGE MIGRATION (#14), runbook W5 -------------------------------------
# Four datastores moved from repo-relative binds to `${AURORA_STATE_ROOT:-...}`
# so the migration window is a checkout and the undo is a checkout:
#
#     forgejo  .hermes  arcadedb            (here)
#     affine/data/postgres                  (affine/compose.yml)
#
# FLIP BACK: `docker compose down && git checkout main && docker compose up -d`.
# AURORA_STATE_ROOT cannot flip back on its own -- the leaf names differ from
# the old layout (`hermes` vs `.hermes`, `affine-postgres` vs
# `affine/data/postgres`), so the variable only ever repoints at another
# aurora-state-shaped tree (that is what the runbook's rehearsal uses it for).
#
# WHILE THIS BRANCH IS CHECKED OUT, DO NOT RUN `./aurora branch up`. These
# sources are absolute, so a branch worktree binds production's state root
# read-write instead of its own seeded copy. tests/test_branch_overlay.py::
# test_no_daemon_global_key_escapes_unaccounted is red for that reason and is
# correct to be.
# -----------------------------------------------------------------------------

services:
  caddy:
    image: caddy:latest@sha256:844f60b64e4724a5aa8245e019dace0d3f199f7433ce6c57676cb30a920dbad9
    restart: unless-stopped
    network_mode: host
    cap_add: 
      - NET_ADMIN
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /var/run/tailscale:/var/run/tailscale:ro
      - caddy_data:/data
      - caddy_config:/config
      - ./Caddyfile.d:/etc/caddy/Caddyfile.d
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME}
      - HERMES_SERVE_PORT=${HERMES_SERVE_PORT:-7444}
      # Defaults are production's, so this is behaviour-neutral here; a
      # branch overrides them with service DNS in its own .env.
      - AFFINE_UPSTREAM=${AFFINE_UPSTREAM:-127.0.0.1:3010}
      - FORGEJO_UPSTREAM=${FORGEJO_UPSTREAM:-127.0.0.1:3000}
      - FJELL_UPSTREAM=${FJELL_UPSTREAM:-127.0.0.1:9080}

  forgejo:
    image: codeberg.org/forgejo/forgejo:15@sha256:eda2e378442d2f18cfa563994f8ad66e71f04ac9c3bb4259cc57bdd641890f5c
    container_name: forgejo
    environment:
      - USER_UID=${FORGEJO_USER_UID:-1000}
      - USER_GID=${FORGEJO_USER_GID:-1000}
      # Spec 5.4 layer 3: a branch's forge must be visibly a branch's forge, so
      # nobody merges into the wrong one. The DEFAULT is production's current
      # value, which makes parameterising this behaviour-neutral here; a branch
      # sets FORGEJO_APP_NAME=<this> [BRANCH: <name>] from branch-env.yaml.
      # Pinned three independent ways by tests/test_repo_conformance.py --
      # a bare ${FORGEJO_APP_NAME} would expand to empty and satisfy "not a
      # literal" while erasing the name.
      - FORGEJO____APP_NAME=${FORGEJO_APP_NAME:-null-hub}
      - FORGEJO__server__ROOT_URL=https://${DOMAIN_NAME}/git/
      - FORGEJO__server__DOMAIN=${DOMAIN_NAME}
      # Self-service sign-up. Safe here because the whole stack is only
      # reachable over the Tailnet — there is no public ingress.
      # Declared here rather than edited into forgejo/conf/app.ini so the
      # setting is reproducible from the repo and survives a container
      # recreate (Forgejo maps FORGEJO__section__KEY onto app.ini at boot).
      # NOTE the sense: this is DISABLE_REGISTRATION, so "false" = sign-up
      # is OPEN. Set FORGEJO_DISABLE_REGISTRATION=true in .env to close it.
      - FORGEJO__service__DISABLE_REGISTRATION=${FORGEJO_DISABLE_REGISTRATION:-false}
      # No mail server is configured, so email confirmation would leave new
      # accounts permanently unactivated.
      - FORGEJO__service__REGISTER_EMAIL_CONFIRM=false
      - FORGEJO__service__ENABLE_CAPTCHA=false

    restart: unless-stopped

    # Gates dev-admin. Without it, dev-admin runs `reconcile` the instant this
    # CONTAINER starts - before Forgejo is SERVING - and dies with curl exit
    # 22 on every fresh deploy. /api/healthz reports cache and database
    # readiness, not merely a listening socket. curl ships in this image
    # (/usr/bin/curl) and the endpoint was probed returning 200 with
    # cache:ping and database:ping both "pass".
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:3000/api/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

    volumes:
      - ${AURORA_STATE_ROOT:-/home/aurora-state}/forgejo:/data
      - /etc/localtime:/etc/localtime:ro
    ports:
      - 127.0.0.1:3000:3000
      - 127.0.0.1:222:22
    depends_on: 
      - caddy

  forgejo-mcp:
    image: codeberg.org/goern/forgejo-mcp:v2.30.2@sha256:207daf82da6dc3267471385da951f5730ca6428d22d3344c54f193e4f5991853
    container_name: forgejo-mcp
    restart: unless-stopped
    # Multi-tenant HTTP mode: no FORGEJO_ACCESS_TOKEN in env.
    # Each Hermes client passes its own token via Authorization header.
    command: ["--transport", "http", "--url", "${FORGEJO_URL}"]
    expose:
      - "8080"
    depends_on:
      - forgejo
    # No ports: — internal-only, reachable by peer containers on the
    # default compose network. Caddy is NOT in front.

  fjell:
    build: ./fjell
    restart: unless-stopped
    ports:
      - 127.0.0.1:9080:9080
    environment:
      # Service DNS, not 127.0.0.1: Caddy is host-networked but fjell is not,
      # and a branch publishes no host ports at all. The hub replays the
      # caller's Forgejo cookie here to learn who they are.
      - FORGEJO_INTERNAL_URL=${FORGEJO_INTERNAL_URL:-http://forgejo:3000}
      # Deliberately NOT under /app: that is where the binary lives, and
      # tests/test_branch_acceptance.py has a general rule against nested
      # /app mounts earned by a real production-breaking defect.
      - AGENTS_JSON_PATH=/etc/aurora/roster/agents.json
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # The provisioned-agent roster, as `dev-admin reconcile` writes it.
      # Without this mount the hub can never match a caller to an agent —
      # AGENTS_JSON_PATH pointed at a path nothing mounted, so load_agents()
      # silently returned an empty roster (defect found 2026-07-31).
      - ./Caddyfile.d:/etc/aurora/roster:ro
      #- ~/.ssh/authorized_keys:/app/authorized_keys

  # Per-agent authorization gate. Hermes' OIDC plugin authenticates but does
  # not authorize — it has no user allowlist ("the IDP's own allowlist is
  # authoritative"), and Forgejo has no per-OAuth2-app user restriction. So
  # without this ANY valid Forgejo account can open ANY developer's agent.
  # Caddy calls this via forward_auth before proxying; it verifies the
  # session JWT against the issuer JWKS and checks the caller owns the agent.
  agent-authz:
    build: ./agent-authz
    image: agent-authz:local
    restart: unless-stopped
    environment:
      - OIDC_ISSUER=https://${DOMAIN_NAME}/git
      - OWNERS_PATH=/etc/agent-authz/owners.json
      - LISTEN_PORT=9140
    volumes:
      # Written by `dev-admin reconcile`; reloaded on mtime change so
      # provisioning a developer takes effect without a restart.
      - ./agent-authz/data:/etc/agent-authz:ro
    ports:
      - 127.0.0.1:9140:9140

  hermes:
    image: nousresearch/hermes-agent:latest@sha256:bbe5076a990ba59afb6c6ee9bb1084a26b801b732b9fb82a18de862d226e59b4
    container_name: hermes
    restart: unless-stopped
    command: gateway run
    volumes:
      # STATE ROOT (#14 storage migration, runbook W5). Was `./.hermes`,
      # repo-relative since M6 -- and repo-relative is what gave every branch
      # its OWN agent state. This path is absolute, so on this branch a branch
      # worktree binds PRODUCTION's `.hermes`, which is exactly what M6
      # removed. See the header note above `services:`.
      - ${AURORA_STATE_ROOT:-/home/aurora-state}/hermes:/opt/data
      - /var/run/docker.sock:/var/run/docker.sock
      # Repo-relative, and the TARGET is deliberately `aurora` rather than a
      # checkout name: a branch's Hermes must see its own worktree at a
      # stable path, not production's tree at a path that names production.
      - .:/opt/data/workspace/aurora
    group_add:                                                                                                                                                                                                            
      - "${DOCKER_GID}"                                                                                                                                                                       
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - HERMES_DASHBOARD=1
      - HERMES_DASHBOARD_HOST=0.0.0.0
      - HERMES_DASHBOARD_BASIC_AUTH_USERNAME=${HERMES_DASHBOARD_USER}
      - HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=${HERMES_DASHBOARD_PASS}
      - HERMES_DASHBOARD_SECRET=${HERMES_DASHBOARD_SECRET}
      - OPENCODE_GO_API_KEY=${OPENCODE_GO_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      # User plugins (ponytail, etc.) live under $HERMES_HOME/plugins.
      # Volumes bind ~/.hermes to /opt/data, so HERMES_HOME must follow
      # the bind target or the plugin loader scans an empty path inside
      # the container and silently loads nothing.
      - HERMES_HOME=/opt/data


    expose:
      - "8642"   # API server (internal only, for fjell/future tools)
      - "9119"   # dashboard (internal, via host 127.0.0.1 publish)
    ports:
      # Keep local browser access working and also expose the dashboard on
      # this host's Tailscale interface for remote Hermes Desktop clients.
      - 127.0.0.1:9119:9119
      # This host's tailnet address, so remote Hermes Desktop clients can
      # reach the admin dashboard. Parameterised because it is THIS host's
      # identity: a branch reaches its own address through its own sidecar
      # and publishes nothing (spec 5.1).
      - ${HERMES_TAILNET_IP:-100.86.36.78}:9119:9119
    shm_size: 1g   # Playwright/Chromium needs it

  dev-admin:
    build: ./dev-administration
    image: dev-admin:local
    container_name: dev-admin
    restart: "no"
    volumes:
      - ./dev-administration:/app:ro
      - ./developers.yaml:/app/developers.yaml
      - /var/run/docker.sock:/var/run/docker.sock
      # Where reconcile writes each agent's OIDC credentials; compose.agents.yml
      # reads them back as an optional env_file. Repo-relative, so a branch
      # writes its own.
      - ./.agent-env:/agent-env
      # Read-only, so reconcile can warn when the committed fragment no
      # longer matches developers.yaml. It cannot regenerate it — the file is
      # tracked and lives on the host side.
      #
      # Mounted at / and NOT under /app. `/app` is itself a read-only bind of
      # ./dev-administration, and a file mounted inside it needs its
      # mountpoint to already exist in the SOURCE directory. developers.yaml
      # works only because dev-administration/developers.yaml is a real file;
      # there is no dev-administration/compose.agents.yml, so runc had to
      # create one inside a :ro mount and the container refused to start.
      # Found by Task 12's acceptance from a clean checkout — production runs
      # an older compose.yml and had never exercised it.
      - ./compose.agents.yml:/compose.agents.yml:ro
      # Where reconcile writes the agent->owner map that agent-authz enforces
      # (agent-authz binds the same host directory read-only). Repo-relative,
      # so a branch writes its own.
      #
      # This bind did not exist until 2026-07-30. provision.py wrote to
      # $OWNERS_MAP_PATH, whose default `/output/agent-authz-data/owners.json`
      # was mounted nowhere, so `os.makedirs` succeeded inside the container,
      # the map was discarded with the container, and agent-authz went on
      # enforcing a file three days stale. It failed silently: the code's
      # "per-agent authorization will DENY" warning is on an except OSError,
      # and writing into the container's own layer raises nothing.
      # agents.conf/agents.json were unaffected because those are written by
      # docker exec into the Caddy container instead of through a bind.
      - ./agent-authz/data:/agent-authz-data
    environment:
      # Set explicitly rather than left to provision.py's default, so the
      # path and the bind above are one edit apart instead of in two files.
      - OWNERS_MAP_PATH=/agent-authz-data/owners.json
      - FORGEJO_URL=${FORGEJO_URL}
      - FORGEJO_ADMIN_TOKEN=${FORGEJO_ADMIN_TOKEN}
      - AURORA_PROFILE_URL=${AURORA_PROFILE_URL}
      - DOMAIN_NAME=${DOMAIN_NAME}
      - CADDY_CONFIG_DIR=/output
      # No CADDY_CONTAINER: dev-admin writes agents.conf/agents.json by
      # docker-exec'ing into the Caddy container it resolves from THIS
      # project's compose labels. A literal name here would make a branch's
      # reconcile rewrite production's Caddy config.
      - COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME:-aurora}
      - AGENT_UPSTREAM_MODE=${AGENT_UPSTREAM_MODE:-published}
      - AGENT_ENV_DIR=/agent-env
      - AGENTS_COMPOSE_PATH=/compose.agents.yml
      - FORGEJO_ORG=${FORGEJO_ORG:-obsidura}
      - FORGEJO_DEV_TEAM=${FORGEJO_DEV_TEAM:-developers}
    command: ["reconcile"]
    depends_on:
      forgejo:
        condition: service_healthy
      # dev-admin reaches Forgejo THROUGH Caddy and docker-execs into Caddy to
      # write Caddyfile.d, so Caddy must at least exist. Compose offers no
      # health condition for a host-networked container that serves before its
      # own generated config is written, so the residual window is covered by
      # the bounded retry in forgejo_utils._curl.
      caddy:
        condition: service_started

  # Candidate knowledge-graph store. Not yet integrated with any service —
  # kept declared so it is code rather than an undeclared survivor.
  # Exited 137 (SIGKILL, most likely OOM) on 2026-07-23. NOTE: JAVA_OPTS below
  # lowers the INITIAL heap (-Xms 2G -> 512m) but NOT the maximum: -Xmx2g is the
  # same value as the image default -Xmx2G, so the OOM ceiling is unchanged.
  # See docs/issues/arcadedb-oom.md before relying on this service.
  arcadedb:
    image: arcadedata/arcadedb:26.7.3@sha256:9354acbd2f5c8aeacfa9846255a3c93d0aee2b6c684e589a7a47b15e681ba796
    restart: unless-stopped
    environment:
      - JAVA_OPTS=-Xms512m -Xmx2g
      - ARCADEDB_ROOT_PASSWORD=${ARCADEDB_ROOT_PASSWORD}
    ports:
      - 127.0.0.1:2424:2424
      - 127.0.0.1:2480:2480
    volumes:
      - ${AURORA_STATE_ROOT:-/home/aurora-state}/arcadedb:/home/arcadedb/databases
      - arcadedb_backups:/home/arcadedb/backups
      - arcadedb_config:/home/arcadedb/config
      - arcadedb_log:/home/arcadedb/log
      - arcadedb_replication:/home/arcadedb/replication

volumes:
  caddy_data:
  caddy_config:
  arcadedb_backups:
  arcadedb_config:
  arcadedb_log:
  arcadedb_replication:

