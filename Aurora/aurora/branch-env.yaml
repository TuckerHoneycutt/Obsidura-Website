# Every variable a branch .env MUST override, and how it is derived.
#
# A branch .env is rendered FROM production's, so anything absent here is
# INHERITED -- and inheritance failures are silent: no error, no warning, just
# a branch quietly wired to production. That has already happened once
# (COMPOSE_PROFILES, caught in review rather than by a test), which is why this
# file exists at all: a blockquote in a spec cannot fail a build.
#
# `fatal:` is REQUIRED on every entry and is deliberately not defaulted.
# "Is it safe for a branch to inherit this?" is the only question this file
# answers, and an entry that declines to answer it is worse than no entry --
# the reader assumes the safe reading and the loader would have to guess.
# aurora_cli.envfile.load_manifest() refuses a manifest with an entry that
# omits it.
#
# Checked in BOTH directions by tests/test_branch_env.py:
#   * a rendered branch .env that misses an entry here fails;
#   * a variable in production's .env whose VALUE contains production's domain
#     and is NOT listed here fails.
# The second direction is the one that finds the NEXT hostname-bearing
# variable by itself. A manifest that only lists what somebody remembered is
# the same failure one release later.
#
# The renderer is NOT the only detector. aurora_cli.envfile also applies
# manifest-free hazard rules to the rendered result (production's domain must
# not survive into any value; COMPOSE_PROJECT_NAME must carry the branch
# namespace; COMPOSE_PROFILES must not activate every developer; no upstream
# may point at loopback). That is on purpose: if deleting an entry here blinded
# both the renderer and the checker, this manifest would pin nothing.

variables:
  - name: COMPOSE_PROJECT_NAME
    derive: branch_project          # br-<name>
    fatal: true
    why: "Without it the branch adopts production's project and `down -v` reaches production's volumes."
  - name: COMPOSE_PROFILES
    derive: agent_profiles          # agent-<user>, or "" for --devs none
    fatal: true
    why: "Inherited `agents` starts EVERY developer's agent, contradicting D7."
  - name: DOMAIN_NAME
    derive: branch_domain
    fatal: true
    why: "The branch's own tailnet name. Caddy's site address and every URL Compose derives from it."
  - name: TS_HOSTNAME
    derive: branch_hostname
    fatal: true
    why: "The Tailscale sidecar's node name. Inherited-absent, the node registers under a name nobody chose."
  - name: TS_AUTHKEY
    derive: ephemeral_authkey
    fatal: true
    secret: true
    why: "D-D: supplied, never minted. A sidecar with no key does NOT fail -- it starts, stays `Logged out.` and serves a dead URL."
  - name: AGENT_UPSTREAM_MODE
    literal: service
    fatal: true
    why: "published mode points Caddy at 127.0.0.1 ports that do not exist in the sidecar netns; the routes then 502 silently."
  - name: AFFINE_UPSTREAM
    literal: affine:3010
    fatal: true
    why: "A branch's Caddy shares the sidecar's netns, where no loopback port of this stack exists. Docker service DNS survives; 127.0.0.1 does not."
  - name: FORGEJO_UPSTREAM
    literal: forgejo:3000
    fatal: true
    why: "As AFFINE_UPSTREAM. The default is production's loopback address, so forgetting this is a stack that starts and 502s."
  - name: FJELL_UPSTREAM
    literal: fjell:9080
    fatal: true
    why: "As AFFINE_UPSTREAM."
  - name: FORGEJO_URL
    derive: branch_url
    suffix: /git
    fatal: true
    why: "N1. dev-admin creates OAuth apps here; inherited, a branch reconciles into PRODUCTION's Forgejo. The label guard cannot catch this -- it is an HTTP call to a hostname, not an operation on a container."
  - name: AFFINE_SERVER_EXTERNAL_URL
    derive: branch_url
    suffix: /affine
    fatal: true
    why: "N1. Inherited, a branch's AFFiNE advertises production's external URL to its own clients."
  - name: AURORA_PROFILE_URL
    derive: branch_url
    suffix: /git/supergoodname77/aurora-agent.git
    fatal: true
    why: "N1. Inherited, a branch's agents clone their profile from production's Forgejo."
  - name: FORGEJO_APP_NAME
    derive: branch_app_name         # <production's app name> [BRANCH: <name>]
    fatal: true
    why: "Spec 5.4 layer 3. Inherited, a branch's forge is indistinguishable from production's in the UI, and the mistake this prevents -- merging into a forge that is about to be destroyed -- happens before any push does. Production does not declare it, so `absent` here means the compose default and NO marker: a silently missing safety layer, which is what fatal is for."
  - name: FORGEJO_ADMIN_TOKEN
    derive: minted_after_up
    fatal: false
    secret: true
    why: "Spec 2026-08-01 P3. A branch's Forgejo is a BYTE-COPY of production's database -- same users, same access_token rows -- so the inherited token authenticates against BOTH, and a branch's dev-admin holds a credential valid on PRODUCTION's API. It cannot be derived here: the branch value is minted by the branch's own forge, which does not exist at render time, and minting it needs the inherited token. So the render deliberately INHERITS, and aurora_cli.forgejo_token.rotate_admin_token replaces it after the branch's Forgejo is serving, then deletes production's token rows from the branch's copy of the database -- in that order, because the delete destroys the credential the mint needs. Listed here anyway: `secret: true` is what puts it under the access document's redaction, and a reader who has just been told `anything absent here is INHERITED` must not conclude this one was forgotten."
  - name: TS_OAUTH_CLIENT_SECRET
    literal: ""
    fatal: true
    secret: true
    why: "Spec 2026-08-01 P6, and it is a REGRESSION this manifest exists to stop. P6 put an OAuth client in production's `.env`, `render_branch_env` copies production's file wholesale, and nothing here overrode it -- so every branch `.env` carried a credential that mints auth keys for the WHOLE tailnet (scope `auth_keys oauth_keys`; the tag is chosen by whoever calls POST /keys, so `tag:aurora-branch` constrains nothing about what this can create). Worse, hermes bind-mounts the worktree root, so every branch container could read it. P3 removes ONE production credential from a branch; without this entry P6 added a stronger one in the same merge. Blanked, not inherited: `tailnet.oauth_client` reads PRODUCTION's `.env` on the HOST before the branch exists, so nothing inside a branch ever needs this. `secret: true` additionally puts it under `access_doc`'s refusal, which was driven only by this flag and therefore did not cover it."
  - name: TS_OAUTH_CLIENT_ID
    literal: ""
    fatal: true
    why: "Blanked with its secret. Half an OAuth client cannot mint anything -- `tailnet.oauth_client` refuses an id without a secret rather than degrading -- so leaving the id behind would be a value that reads like a working credential and is not. Not `secret: true`: a client id is not a secret, and marking it one would make `access_doc` refuse any document that merely names it."
  - name: HERMES_TAILNET_IP
    literal: 127.0.0.1
    fatal: false
    why: "Inert only because `ports: !reset []` removes the publish that reads it. Listed so the coupling is written down rather than assumed."
