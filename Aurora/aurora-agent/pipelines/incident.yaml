name: incident
class: incident
entry: "Something is already wrong, and it is live."
invariants:
  - prime-directives
  - verification-law
  - output-based-assertions
  - mutation-proof
  - practical-testing
  - lease-discipline
stages:
  - skill: routing
    gates: [G-CLASS]
    notes: "Classify and state the one-line G-CLASS answer; live plus wrong is an incident even when the diagnosis is read-only."
  - skill: live-system-etiquette
    notes: "Mandatory; fingerprint baseline first. Reads before writes, and no write without consent given in this session."
  - skill: diagnosing-bugs
    notes: "Diagnose on a replica or ephemeral stack, never live. Feedback loop first, no hypothesis without a red loop."
  - skill: test-driven-development
    notes: "Regression test written against the replica at the seam the incident exposed."
  - skill: mutation-proof
    notes: "Name the mutation the regression test kills before proposing any live apply."
  - skill: practical-testing
    notes: "Rehearse the remedy end to end on the replica; the rehearsal transcript is the evidence the apply rests on."
  - skill: verification-before-completion
    gates: [G-CHECKPOINT, G-DEPLOY]
    notes: "G-CHECKPOINT before any live apply; G-DEPLOY for human deploy or cleanup steps. Re-fingerprint after the apply and compare against baseline."
tripwires:
  - condition: "Any live write is about to happen without explicit human consent given in this session."
    action: "Pause the task; open G-CHECKPOINT (prime directive 2)."
  - condition: "A write has already landed on a resource without this run's lease label."
    action: "Halt; fingerprint against baseline; disclose in full; open G-BLOCKED."
  - condition: "The fingerprint diff shows state the baseline did not predict."
    action: "Stop and report; do not remediate over an unexplained diff."
  - condition: "A step resolves to a destructive verb per core/verbs.md."
    action: "The task becomes a checkpoint task; open G-CHECKPOINT. Tier unchanged."
journal:
  path: ".aurora/runs/<run-id>/journal.jsonl"
  schema: "core/journal.schema.json"
