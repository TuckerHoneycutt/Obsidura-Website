$schema: "https://json-schema.org/draft/2020-12/schema"
title: Aurora pipeline manifest
type: object
required: [name, class, entry, invariants, stages, tripwires, journal]
additionalProperties: false
properties:
  name: {type: string}
  class: {enum: [chore, fix, probe, incident, feature]}
  tier: {type: integer, minimum: 0, maximum: 3}
  entry: {type: string}
  invariants:
    type: array
    items: {type: string}
  stages:
    type: array
    minItems: 1
    items:
      type: object
      required: [skill]
      additionalProperties: false
      properties:
        skill: {type: string}
        gates: {type: array, items: {type: string}}
        params: {type: object}
        notes: {type: string}
  tripwires:
    type: array
    items:
      type: object
      required: [condition, action]
      additionalProperties: false
      properties:
        condition: {type: string}
        action: {type: string}
  journal:
    type: object
    required: [path, schema]
    additionalProperties: false
    properties:
      path: {const: ".aurora/runs/<run-id>/journal.jsonl"}
      schema: {const: "core/journal.schema.json"}
allOf:
  - if: {properties: {class: {const: feature}}}
    then: {required: [tier]}
