name: fix
class: fix
entry: "Something is already wrong, in dev or test."
invariants:
  - prime-directives
  - verification-law
  - output-based-assertions
  - mutation-proof
  - practical-testing
  - lease-discipline
stages:
  - skill: routing
    gates: [G-CLASS]
    notes: "Classify and state the one-line G-CLASS answer before touching the broken surface."
  - skill: using-git-worktrees
    notes: "Reproduce and repair in an ephemeral worktree, never in the environment that reported the bug."
  - skill: diagnosing-bugs
    notes: "Feedback loop first, no hypothesis without a red loop."
  - skill: test-driven-development
    notes: "Regression test at the correct seam - the seam that would have caught this bug, not the one nearest the edit."
  - skill: mutation-proof
    notes: "Name the mutation the regression test kills; a mutation that stays green fails review."
  - skill: practical-testing
    notes: "Re-run the original reproduction end to end, not just the new unit test."
  - skill: verification-before-completion
    notes: "Paste the red-to-green transcript before claiming the fix holds."
  - skill: finishing-a-development-branch
tripwires:
  - condition: "The fix loop reaches round 3 on any task."
    action: "The task was mis-tiered; escalate one tier for the rest of the run."
  - condition: "A step is about to execute a write outside the run's lease."
    action: "Pause the task; open G-CHECKPOINT (prime directive 3)."
  - condition: "A write has already landed on a resource without this run's lease label."
    action: "Halt; fingerprint against baseline; disclose in full; open G-BLOCKED."
  - condition: "A load-bearing claim about the cause or the fix remains UNVERIFIED."
    action: "Open G-FACTS; the run cannot sit below F1 until the claim is measured or ratified."
journal:
  path: ".aurora/runs/<run-id>/journal.jsonl"
  schema: "core/journal.schema.json"
