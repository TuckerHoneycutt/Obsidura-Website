name: f3
class: feature
tier: 3
entry: "Everything else, at F3: the human ratifies every decision and the agent owns fact-gathering only."
invariants:
  - prime-directives
  - verification-law
  - output-based-assertions
  - mutation-proof
  - practical-testing
  - lease-discipline
stages:
  - skill: routing
    gates: [G-CLASS]
    notes: "Classify, state the one-line G-CLASS answer, and name the tier before any file is opened."
  - skill: wayfinder
    gates: [G-DECISION]
    notes: "Chart the map before grilling; G-DECISION per ticket. The human ratifies every decision, the agent owns fact-gathering only."
  - skill: grilling
    gates: [G-DECISION]
    notes: "Breadth-first across the whole map, then depth; G-DECISION per decision batch."
  - skill: domain-modeling
    gates: [G-DECISION]
    notes: "Names the entities and invariants the map and the grilling decisions imply; each further modelling decision batch re-opens G-DECISION."
  - skill: reality-gate
    gates: [G-FACTS]
    notes: "Measure every load-bearing claim the design will rest on; G-FACTS on anything that comes back UNVERIFIED."
  - skill: competing-designs
    gates: [G-DESIGN]
    notes: "Measured mode: 3 agents, 3 ephemeral stacks, spikes with numbers. Spikes run in ephemeral stacks only; core/lease/SPEC.md is a stub, so lease labels on spike resources are asserted by hand until it lands. G-DESIGN once the designs have reported."
  - skill: to-spec
    gates: [G-SPEC]
    notes: "Spec document, not an inline spec; G-SPEC ratifies it before any code exists."
  - skill: writing-plans
    notes: "Per-task named mutation table mandatory; a task with no named mutation is not planned."
  - skill: using-git-worktrees
    notes: "Ephemeral worktree and ephemeral environment, per prime directive 1."
  - skill: subagent-driven-development
    gates: [G-SEAMS, G-PLANCONFLICT]
    notes: "Reviewer axes standards + spec + vacuity-review; G-SEAMS before the first test is written; G-PLANCONFLICT as needed when a review finding contradicts plan text."
  - skill: mutation-proof
    notes: "Every mutation in the plan's table is killed and shown killed; a mutation that stays green fails spec review and is never suppressible."
  - skill: practical-testing
    notes: "Exercise the feature the way a caller does, against the ratified spec document."
  - skill: verification-before-completion
    notes: "Paste the command and its output before any success claim."
  - skill: requesting-code-review
    notes: "Standards + spec + vacuity axes on the assembled branch."
  - skill: finishing-a-development-branch
    gates: [G-E2E]
    notes: "G-E2E before PR."
tripwires:
  - condition: "Breadth-first grilling surfaces no fog - every branch of the map is already answered."
    action: "De-escalate F3 -> F2 and continue on pipelines/f2.yaml. The only automatic de-escalation."
  - condition: "Competing designs fail to reach consensus."
    action: "Already in measured mode; spike further in ephemeral stacks and take the decision to G-DESIGN on numbers."
  - condition: "The fix loop reaches round 3 on any task."
    action: "F3 is the ceiling - there is no higher tier to escalate into. Halt the task and open G-BLOCKED (fix-loop breaker on a load-bearing finding)."
  - condition: "A step is about to execute a write outside the run's lease."
    action: "Pause the task; open G-CHECKPOINT (prime directive 3)."
  - condition: "A write has already landed on a resource without this run's lease label."
    action: "Halt; fingerprint against baseline; disclose in full; open G-BLOCKED."
  - condition: "The reality gate returns UNVERIFIED on a load-bearing claim."
    action: "Open G-FACTS; the claim is measured or ratified before the design rests on it."
  - condition: "The scope grows past what the spec document ratified."
    action: "Re-open G-SPEC; the human ratifies the widened spec before work continues."
journal:
  path: ".aurora/runs/<run-id>/journal.jsonl"
  schema: "core/journal.schema.json"
