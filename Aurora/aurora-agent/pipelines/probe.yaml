name: probe
class: probe
entry: "The deliverable is a decision or a fact rather than code."
invariants:
  - prime-directives
  - verification-law
  - output-based-assertions
  - mutation-proof
  - practical-testing
  - lease-discipline
stages:
  - skill: routing
    gates: [G-CLASS]
    notes: "Classify and state the one-line G-CLASS answer; a probe produces a finding, not a diff."
  - skill: reality-gate
    gates: [G-FACTS]
    notes: "Measure every load-bearing claim; G-FACTS is conditional - it fires only on a claim that came back UNVERIFIED."
  - skill: doc-budget
    notes: "Finding written as cited markdown, terse. No worktree and no code review - there is nothing to build or to review."
tripwires:
  - condition: "The scope grows to include writing or changing code."
    action: "Reclassify: re-enter routing and pick the class the new deliverable answers to."
  - condition: "A load-bearing claim remains UNVERIFIED after the reality gate."
    action: "Open G-FACTS; the finding may not present that claim as measured."
  - condition: "The investigation implies a write to a production or shared resource."
    action: "Pause the task; open G-CHECKPOINT (prime directive 2). Prod reads are fine; prod writes are not."
  - condition: "A write has already landed on a resource without this run's lease label."
    action: "Halt; fingerprint against baseline; disclose in full; open G-BLOCKED."
journal:
  path: ".aurora/runs/<run-id>/journal.jsonl"
  schema: "core/journal.schema.json"
