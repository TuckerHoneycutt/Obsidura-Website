kind: schema
name: sync.request
version: 1
document:
  type: object
  required:
  - requester
  additionalProperties: false
  properties:
    requester:
      type: string
    jql:
      type: string
      maxLength: 1000
    channel:
      type: string
      maxLength: 200
    limit:
      type: integer
      minimum: 1
      maximum: 500
