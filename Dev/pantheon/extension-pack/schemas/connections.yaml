kind: schema
name: sync.request
version: 1
document:
  type: object
  required:
  - requester
  additionalProperties: false
  properties:
    requester:
      type: string
    jql:
      type: string
      maxLength: 1000
    channel:
      type: string
      maxLength: 200
    limit:
      type: integer
      minimum: 1
      maximum: 500

---
kind: schema
name: sync.request
version: 2
document:
  type: object
  required:
  - requester
  additionalProperties: false
  properties:
    requester:
      type: string
    jql:
      type: string
      maxLength: 1000
    channel:
      type: string
      maxLength: 200
    path:
      type: string
      maxLength: 900
    link:
      type: string
      maxLength: 1600
    limit:
      type: integer
      minimum: 1
      maximum: 500

---
# Third wave: Google. `link` already covered Drive, so v3 exists for the
# arguments the rest of the suite needs — a Gmail search, a calendar window,
# a BigQuery statement. Declared together, once, so the surfaces that arrive
# later need no fourth version: the registry is append-only, and a schema
# version is cheaper to over-declare than to re-cut.
kind: schema
name: sync.request
version: 3
document:
  type: object
  required:
  - requester
  additionalProperties: false
  properties:
    requester:
      type: string
    jql:
      type: string
      maxLength: 1000
    channel:
      type: string
      maxLength: 200
    path:
      type: string
      maxLength: 900
    link:
      type: string
      maxLength: 1600
    query:
      type: string
      maxLength: 1000
    range:
      type: string
      maxLength: 100
    sql:
      type: string
      maxLength: 4000
    limit:
      type: integer
      minimum: 1
      maximum: 500

---
# A saved Google sync recipe: which door, with what argument — or which
# saved recipe to remove. The 06:30 refresh replays the saved list.
kind: schema
name: sync.schedule
version: 1
document:
  type: object
  required:
  - requester
  additionalProperties: false
  properties:
    requester:
      type: string
    source:
      type: string
      enum: [drive, gmail, gcal, bigquery, gcs]
    arg:
      type: string
      maxLength: 4000
    remove:
      type: string
      maxLength: 40

---
kind: schema
name: sync.scheduled
version: 1
document:
  type: object
  required:
  - action
  - id
  - count
  properties:
    action:
      type: string
      enum: [saved, removed]
    id:
      type: string
    count:
      type: integer

---
kind: schema
name: sync.refreshed
version: 1
document:
  type: object
  required:
  - ran
  - failed
  properties:
    ran:
      type: integer
    failed:
      type: integer
    notes:
      type: string
