kind: schema
name: ingest.upload
version: 1
document:
  type: object
  required:
  - filename
  - media_type
  - size_bytes
  - requester
  additionalProperties: false
  properties:
    filename:
      type: string
      maxLength: 255
    media_type:
      type: string
    size_bytes:
      type: integer
      minimum: 1
      maximum: 8388608
    content_b64:
      type: string
    blob_sha256:
      type: string
      pattern: ^[a-f0-9]{64}$
    requester:
      type: string
    note:
      type: string
      maxLength: 2000

---
kind: schema
name: ingest.result
version: 1
document:
  type: object
  required:
  - source_filename
  - media_type
  - kind
  - sha256
  - summary
  additionalProperties: false
  properties:
    source_filename:
      type: string
    media_type:
      type: string
    kind:
      type: string
      enum:
      - table
      - document
      - image
      - data
    sha256:
      type: string
      pattern: ^[a-f0-9]{64}$
    summary:
      type: string
      maxLength: 4000
    requester:
      type: string
    table:
      type: object
      required:
      - row_source_key
      - rows
      - columns
      properties:
        row_source_key:
          type: string
        rows:
          type: integer
          minimum: 0
        columns:
          type: array
          items:
            type: object
            required:
            - name
            - dtype
            properties:
              name:
                type: string
              dtype:
                type: string
                enum:
                - text
                - int
                - float
                - bool
                - timestamp
                - unknown
    file:
      type: object
      required:
      - blob_key
      - media_type
      properties:
        blob_key:
          type: string
        media_type:
          type: string
    record:
      type: object

---
kind: schema
name: ingest.cataloged
version: 1
document:
  type: object
  required:
  - catalog_id
  - sha256
  - kind
  additionalProperties: false
  properties:
    catalog_id:
      type: string
    sha256:
      type: string
    kind:
      type: string
      enum:
      - table
      - document
      - image
      - data
