# External-API package (Appendix B): curated snapshots + liveness monitoring.
# The web registry is a JSON index object in the blob store.
kind: resource
name: web
version: 1
connector: { type: http, base_url: "" }
verbs: [request]
---
kind: trigger
name: web.curate
version: 1
source: { type: webhook, path: /hooks/curate }
emits: web.curate_request@1
---
kind: task
name: web_snapshot
version: 1
runner: { type: script, runtime: python, entry: ext_actions.web_snapshot.run }
input: web.curate_request@1
output: web.snapshot@1
on: [web.curate@1]
uses:
  - { resource: web@1, verbs: [request] }
  - { resource: blob_store@1, verbs: [get, put] }
policy: { timeout_ms: 60000, retry: 1, idempotent: true }
---
kind: trigger
name: liveness.tick
version: 1
source: { type: cron, schedule: "0 * * * *" }
emits: ext.cron_tick@1
---
kind: task
name: api_liveness
version: 1
runner: { type: script, runtime: python, entry: ext_actions.api_liveness.run }
input: ext.cron_tick@1
output: web.status@1
on: [liveness.tick@1]
uses:
  - { resource: web@1, verbs: [request] }
  - { resource: blob_store@1, verbs: [get, put] }
policy: { timeout_ms: 120000, retry: 0, idempotent: true }
---
kind: grant
name: alice_ext_web
version: 1
user: alice
resource: web@1
verbs: [request]
scope:
  type: url_allowlist
  patterns:
    - https://api.frankfurter.dev/*
    - https://raw.githubusercontent.com/*
    - https://en.wikipedia.org/*
---
kind: grant
name: bob_ext_web
version: 1
user: bob
resource: web@1
verbs: [request]
scope:
  type: url_allowlist
  patterns:
    - https://api.frankfurter.dev/*
