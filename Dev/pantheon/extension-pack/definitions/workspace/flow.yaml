# Workspace package: read your own slice of the catalog and schedules.
#
# The console can't reach the blob store directly, so viewing a workspace
# is a governed run like everything else — the snapshot task reads the
# indexes under the caller's grant, narrows by requester, and returns a
# JSON file the page renders. The audit gains a line every time someone
# looks at their own inventory, which is honest bookkeeping.
kind: trigger
name: workspace.hook
version: 1
source: { type: webhook, path: /hooks/workspace }
emits: sync.request@2
---
kind: task
name: workspace_snapshot
version: 1
runner: { type: script, runtime: python, entry: ext_actions.workspace_snapshot.run }
input: sync.request@2
output: kernel.file@1
on: [workspace.hook@1]
uses:
  - { resource: blob_store@1, verbs: [get] }
policy: { timeout_ms: 30000, retry: 1, idempotent: true }
