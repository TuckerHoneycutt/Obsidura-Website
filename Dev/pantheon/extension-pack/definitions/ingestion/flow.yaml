# Ingestion package: desktop upload -> normalize -> catalog -> describe.
# The catalog is a JSON index object in the blob store: the engine's postgres
# connector is read-only by design, so mutable state crosses the proxy as
# audited blob get/put.
kind: trigger
name: upload.file
version: 1
source: { type: webhook, path: /hooks/upload }
emits: ingest.upload@1
---
kind: resource
name: blob_store
version: 1
connector:
  type: s3
  endpoint: http://localhost:9000
  bucket: pantheon-ingest
  access_key_env: PANTHEON_S3_ACCESS_KEY
  secret_key_env: PANTHEON_S3_SECRET_KEY
verbs: [get, put]
---
kind: task
name: ingest_normalize
version: 1
runner: { type: script, runtime: python, entry: ext_actions.ingest_normalize.run }
input: ingest.upload@1
output: ingest.result@1
on: [upload.file@1]
then: [catalog_register@1]
uses:
  - { resource: blob_store@1, verbs: [put, get] }
policy: { timeout_ms: 120000, retry: 1, idempotent: true }
---
kind: task
name: catalog_register
version: 1
runner: { type: script, runtime: python, entry: ext_actions.catalog_register.run }
input: ingest.result@1
output: ingest.cataloged@1
then: [agent_describe@1]
uses:
  - { resource: blob_store@1, verbs: [get, put] }
policy: { timeout_ms: 30000, retry: 2, idempotent: true }
---
kind: grant
name: alice_ext_blob
version: 1
user: alice
resource: blob_store@1
verbs: [get, put]
scope: { type: all }
---
kind: grant
name: bob_ext_blob
version: 1
user: bob
resource: blob_store@1
verbs: [get, put]
scope: { type: all }
