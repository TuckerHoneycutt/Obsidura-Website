  - { resource: gstorage@1, verbs: [request] }
  - { resource: blob_store@1, verbs: [get, put] }
policy: { timeout_ms: 180000, retry: 1, idempotent: true }
---
kind: grant
name: alice_gmail
version: 1
user: alice
resource: gmail@1
verbs: [request]
scope:
  type: url_allowlist
  patterns:
  - "https://gmail.googleapis.com/gmail/v1/users/me/messages"
---
kind: grant
name: alice_gcalendar
version: 1
