version: 1
source: { type: webhook, path: /hooks/sync-gcs }
emits: sync.request@3
---
kind: task
name: gmail_sync
version: 1
runner: { type: script, runtime: python, entry: ext_actions.gmail_sync.run }
input: sync.request@3
output: ingest.result@1
on: [gmail.sync.hook@1]
then: [catalog_register@1]
uses:
  - { resource: gauth@1, verbs: [request] }
  - { resource: gmail@1, verbs: [request] }
  - { resource: blob_store@1, verbs: [get, put] }
policy: { timeout_ms: 180000, retry: 1, idempotent: true }
---
kind: task
name: gcal_sync
version: 1
runner: { type: script, runtime: python, entry: ext_actions.gcal_sync.run }
input: sync.request@3
output: ingest.result@1
on: [gcal.sync.hook@1]
then: [catalog_register@1]
uses:
  - { resource: gauth@1, verbs: [request] }
  - { resource: gcalendar@1, verbs: [request] }
  - { resource: blob_store@1, verbs: [get, put] }
policy: { timeout_ms: 120000, retry: 1, idempotent: true }
---
kind: task
name: bigquery_sync
version: 1
runner: { type: script, runtime: python, entry: ext_actions.bigquery_sync.run }
input: sync.request@3
output: ingest.result@1
on: [bigquery.sync.hook@1]
then: [catalog_register@1]
uses:
  - { resource: gauth@1, verbs: [request] }
  - { resource: gbigquery@1, verbs: [request] }
  - { resource: blob_store@1, verbs: [get, put] }
# jobs.query may hold the line 20s, then the action polls up to two more
# minutes — the task ceiling leaves room for both plus ingest.
policy: { timeout_ms: 240000, retry: 1, idempotent: true }
---
kind: task
name: gcs_sync
version: 1
runner: { type: script, runtime: python, entry: ext_actions.gcs_sync.run }
input: sync.request@3
output: ingest.result@1
on: [gcs.sync.hook@1]
