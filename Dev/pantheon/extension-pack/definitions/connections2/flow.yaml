# Connections, second wave: the NAS, direct file links, Microsoft 365.
#
# Same rule as the first wave — importers, not query surfaces, with every
# host and credential an operator setting resolved at call time. The NAS is
# any S3-compatible store; the file puller covers SAS links and presigned
# URLs (the credential rides in the link); Microsoft 365 goes through
# Graph, where the task mints its own short-lived token at the governed
# login resource — the one place a resource opts into task-supplied
# Authorization, because the token never existed anywhere else.
kind: resource
name: nas
version: 1
connector:
  type: s3
  endpoint: ""
  bucket: ""
  endpoint_env: PANTHEON_NAS_ENDPOINT
  bucket_env: PANTHEON_NAS_BUCKET
  access_key_env: PANTHEON_NAS_ACCESS
  secret_key_env: PANTHEON_NAS_SECRET
verbs: [get]
---
kind: resource
name: webfile
version: 1
connector:
  type: http
  base_url_env: PANTHEON_FILE_BASE
verbs: [request]
---
kind: resource
name: mslogin
version: 1
connector:
  type: http
  base_url: "https://login.microsoftonline.com"
verbs: [request]
---
kind: resource
name: msgraph
version: 1
connector:
  type: http
  base_url: "https://graph.microsoft.com"
  allow_task_auth: true
verbs: [request]
---
kind: trigger
name: nas.sync.hook
version: 1
source: { type: webhook, path: /hooks/sync-nas }
emits: sync.request@2
---
kind: trigger
name: file.sync.hook
version: 1
source: { type: webhook, path: /hooks/sync-file }
emits: sync.request@2
---
kind: trigger
name: ms.sync.hook
version: 1
source: { type: webhook, path: /hooks/sync-ms }
emits: sync.request@2
---
kind: task
name: nas_sync
version: 1
runner: { type: script, runtime: python, entry: ext_actions.nas_sync.run }
input: sync.request@2
output: ingest.result@1
on: [nas.sync.hook@1]
then: [catalog_register@1]
uses:
  - { resource: nas@1, verbs: [get] }
  - { resource: blob_store@1, verbs: [get, put] }
policy: { timeout_ms: 120000, retry: 1, idempotent: true }
---
kind: task
name: file_sync
version: 1
runner: { type: script, runtime: python, entry: ext_actions.file_sync.run }
input: sync.request@2
output: ingest.result@1
on: [file.sync.hook@1]
then: [catalog_register@1]
uses:
  - { resource: webfile@1, verbs: [request] }
  - { resource: blob_store@1, verbs: [get, put] }
policy: { timeout_ms: 120000, retry: 1, idempotent: true }
---
kind: task
name: msgraph_sync
version: 1
runner: { type: script, runtime: python, entry: ext_actions.msgraph_sync.run }
input: sync.request@2
output: ingest.result@1
on: [ms.sync.hook@1]
then: [catalog_register@1]
uses:
  - { resource: mslogin@1, verbs: [request] }
  - { resource: msgraph@1, verbs: [request] }
  - { resource: blob_store@1, verbs: [get, put] }
policy: { timeout_ms: 180000, retry: 1, idempotent: true }
---
kind: grant
name: alice_nas
version: 1
user: alice
resource: nas@1
verbs: [get]
scope: { type: all }
---
kind: grant
name: alice_webfile
version: 1
user: alice
resource: webfile@1
verbs: [request]
scope: { type: all }
---
kind: grant
name: alice_mslogin
version: 1
user: alice
resource: mslogin@1
verbs: [request]
scope: { type: all }
---
kind: grant
name: alice_msgraph
version: 1
user: alice
resource: msgraph@1
verbs: [request]
scope: { type: all }
